<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Most Expensive Sentence in Surgery: CT Reviewed</title>
  <desc id="desc">Infographic comparing the physician work behind independent CT review with the weak documentation phrase CT reviewed.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="630" fill="#0b1f3a"/>
  <rect x="54" y="48" width="1092" height="534" rx="18" fill="#ffffff"/>
  <text x="600" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#0b1f3a">THE MOST EXPENSIVE SENTENCE IN SURGERY</text>
  <text x="600" y="157" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#2563eb">"CT REVIEWED"</text>

  <rect x="92" y="205" width="486" height="260" rx="14" fill="#eef6ff" stroke="#b7d4f8" stroke-width="2"/>
  <text x="128" y="254" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0b1f3a">What Actually Happened</text>
  <g font-family="Inter, Arial, sans-serif" font-size="25" fill="#10233f">
    <text x="128" y="307"><tspan fill="#15803d" font-weight="900">✓</tspan> Reviewed 800+ CT images</text>
    <text x="128" y="352"><tspan fill="#15803d" font-weight="900">✓</tspan> Identified critical findings</text>
    <text x="128" y="397"><tspan fill="#15803d" font-weight="900">✓</tspan> Determined operative need</text>
    <text x="128" y="442"><tspan fill="#15803d" font-weight="900">✓</tspan> Discussed findings with patient</text>
    <text x="128" y="487"><tspan fill="#15803d" font-weight="900">✓</tspan> Formulated treatment plan</text>
  </g>

  <rect x="622" y="205" width="486" height="260" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="658" y="254" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0b1f3a">What Was Documented</text>
  <rect x="677" y="305" width="376" height="91" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="865" y="363" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-style="italic" fill="#7c2d12">"CT reviewed."</text>

  <line x1="94" y1="505" x2="1106" y2="505" stroke="#dbe3ef" stroke-width="2"/>
  <text x="600" y="544" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0b1f3a">If you performed the work, document the work.</text>
  <text x="600" y="575" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#2563eb">FREECPTCODEFINDER.COM</text>
  <text x="600" y="601" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Built by Surgeons. Because Nobody Taught This in Residency.</text>
</svg>
