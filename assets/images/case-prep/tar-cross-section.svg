<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Abdominal wall cross-section axial view for TAR planning</title>
  <desc id="desc">Surgical atlas plate showing abdominal wall layers, rectus complex, linea alba, linea semilunaris, neurovascular bundles, retrorectus and preperitoneal planes, posterior sheath, transversalis fascia, peritoneum, and intraabdominal contents.</desc>
  <defs>
    <linearGradient id="skinGrad" x1="0" x2="1"><stop offset="0" stop-color="#f2b39d"/><stop offset="0.5" stop-color="#f7c9b8"/><stop offset="1" stop-color="#f2b39d"/></linearGradient>
    <linearGradient id="fatGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe2a8"/><stop offset="1" stop-color="#f7bf62"/></linearGradient>
    <linearGradient id="muscleGrad" x1="0" x2="1"><stop offset="0" stop-color="#a9413b"/><stop offset="0.5" stop-color="#d96b5f"/><stop offset="1" stop-color="#9d352f"/></linearGradient>
    <linearGradient id="rectusGrad" x1="0" x2="1"><stop offset="0" stop-color="#b63e3b"/><stop offset="0.5" stop-color="#e9786f"/><stop offset="1" stop-color="#aa3631"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#16202a" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24313f"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9f1d1d"/></marker>
    <style>
      .bg{fill:#f7f4ee}.panel{fill:#fffdf8;stroke:#d4c8b8;stroke-width:2}.ink{fill:#1f2933}.muted{fill:#536170}.small{font:500 24px Inter,Arial,sans-serif}.label{font:700 28px Inter,Arial,sans-serif}.h1{font:800 42px Inter,Arial,sans-serif}.h2{font:800 30px Inter,Arial,sans-serif}.note{font:650 25px Inter,Arial,sans-serif}.micro{font:650 21px Inter,Arial,sans-serif}.leader{fill:none;stroke:#24313f;stroke-width:3;marker-end:url(#arrow)}.leaderRed{fill:none;stroke:#9f1d1d;stroke-width:3;marker-end:url(#redArrow)}.fascia{fill:none;stroke:#fbfaf7;stroke-width:10;stroke-linecap:round}.fasciaDark{fill:none;stroke:#7b8794;stroke-width:4;stroke-linecap:round}.planeRetro{fill:#8fd3ff;opacity:.42;stroke:#1976a2;stroke-width:3}.planePre{fill:#a7d7a7;opacity:.38;stroke:#3f8f48;stroke-width:3}.nerve{fill:none;stroke:#f3c623;stroke-width:7;stroke-linecap:round}.vessel{fill:none;stroke:#0f6db0;stroke-width:6;stroke-linecap:round}.artery{fill:none;stroke:#c52222;stroke-width:6;stroke-linecap:round}.peritoneum{fill:none;stroke:#6f4e37;stroke-width:8;stroke-linecap:round}.organ{fill:#c98773;stroke:#7d3d31;stroke-width:3}.callout{fill:#edf7ff;stroke:#88b9d8;stroke-width:2}.warn{fill:#fff4dc;stroke:#d5a33c;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1160"/>
  <rect x="28" y="28" width="1544" height="1104" rx="22" class="panel"/>
  <text x="68" y="86" class="ink h1">Figure A. Abdominal Wall Cross-Section - Axial View</text>
  <text x="68" y="128" class="muted small">Layered abdominal wall anatomy and mesh planes relevant to retrorectus repair and TAR.</text>

