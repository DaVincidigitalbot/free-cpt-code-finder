<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img">
<defs>
<linearGradient id="bowel" x1="0" x2="1"><stop offset="0" stop-color="#f3c7a9"/><stop offset="1" stop-color="#c9836f"/></linearGradient>
<linearGradient id="organ" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7d7bd"/><stop offset="1" stop-color="#b86761"/></linearGradient>
<linearGradient id="muscle" x1="0" x2="1"><stop offset="0" stop-color="#e7a0a0"/><stop offset="1" stop-color="#a94d55"/></linearGradient>
<linearGradient id="thyroid" x1="0" x2="1"><stop offset="0" stop-color="#c77a66"/><stop offset="1" stop-color="#8c3f45"/></linearGradient>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#111827"/></marker>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23577b"/></marker>
<style>
.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#102033}.sub{font:700 14px Inter,Arial,sans-serif;fill:#526173;text-transform:uppercase;letter-spacing:1.2px}.h{font:700 20px Inter,Arial,sans-serif;fill:#102033}.label{font:600 15px Inter,Arial,sans-serif;fill:#132033}.small{font:600 13px Inter,Arial,sans-serif;fill:#263447}.note{font:500 14px Inter,Arial,sans-serif;fill:#344256}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#4b5563}.leader{fill:none;stroke:#1f2937;stroke-width:1.5;marker-end:url(#dot)}.artery{fill:none;stroke:#b91c1c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.vein{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.nerve{fill:none;stroke:#d6a21e;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:7 5}.duct{fill:none;stroke:#7f9b42;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.pearl{fill:#ecfdf5;stroke:#6aa06c;stroke-width:2}.variant{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.flow{fill:#eef6ff;stroke:#23577b;stroke-width:2}.mesh{fill:#dbeafe;stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}.zone1{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.zone2{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.zone3{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.pack{fill:#fef3c7;stroke:#b45309;stroke-width:2}.cut{stroke:#dc2626;stroke-width:5;stroke-dasharray:9 7}.fat{fill:#f6d7a8;stroke:#b7791f;stroke-width:2}
</style>
</defs>
<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Exploratory Laparotomy: Trauma Exploration Plate</text>
<text x="54" y="80" class="note">Four-quadrant packing, systematic exploration, bowel run, retroperitoneal hematoma zones, and damage-control decision-making.</text>
<rect x="44" y="112" width="650" height="395" rx="18" class="panel"/><text x="68" y="150" class="sub">Immediate trauma sequence</text><text x="68" y="178" class="h">Four-Quadrant Packing and Source Control</text>
<path d="M150 205 C255 168 492 168 595 220 C625 295 610 405 550 482 C425 522 270 514 158 475 C108 392 105 285 150 205Z" fill="#f7d7bd" stroke="#8b4b3f" stroke-width="3"/>
<path d="M370 200 L370 492" stroke="#8b4b3f" stroke-width="3" opacity=".45"/><path d="M130 350 L600 350" stroke="#8b4b3f" stroke-width="3" opacity=".45"/>
<rect x="185" y="240" width="115" height="72" rx="12" class="pack"/><text x="206" y="282" class="small">RUQ pack</text>
<rect x="445" y="240" width="115" height="72" rx="12" class="pack"/><text x="466" y="282" class="small">LUQ pack</text>
<rect x="185" y="382" width="115" height="72" rx="12" class="pack"/><text x="206" y="424" class="small">RLQ pack</text>
<rect x="445" y="382" width="115" height="72" rx="12" class="pack"/><text x="466" y="424" class="small">LLQ pack</text>
<ellipse cx="300" cy="278" rx="62" ry="36" fill="url(#organ)" stroke="#7c3f36" stroke-width="2"/><text x="250" y="228" class="label">Liver</text>
<ellipse cx="488" cy="310" rx="34" ry="58" fill="#8b3146" stroke="#5b1d2e" stroke-width="2"/><text x="518" y="310" class="label">Spleen</text>
<path d="M278 360 C340 330 440 352 455 418 C468 472 390 500 320 468 C260 440 248 388 278 360Z" fill="none" stroke="url(#bowel)" stroke-width="22" stroke-linecap="round"/>
<rect x="86" y="462" width="560" height="34" rx="9" class="pearl"/><text x="108" y="485" class="note">Do first: pack all quadrants, control hemorrhage, control contamination.</text>
<rect x="746" y="112" width="650" height="395" rx="18" class="panel"/><text x="770" y="150" class="sub">Systematic exploration</text><text x="770" y="178" class="h">Force the Abdomen Into an Order</text>
<rect x="790" y="208" width="185" height="42" rx="10" class="flow"/><text x="882.5" y="234" text-anchor="middle" class="small">1. Reassess packs</text><path d="M975 229 L1018 229" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1024" y="208" width="150" height="42" rx="10" class="flow"/><text x="1099.0" y="234" text-anchor="middle" class="small">2. Diaphragms</text><path d="M1174 229 L1215 229" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1220" y="208" width="150" height="42" rx="10" class="flow"/><text x="1295.0" y="234" text-anchor="middle" class="small">3. Liver/spleen</text>
<rect x="790" y="285" width="205" height="42" rx="10" class="flow"/><text x="892.5" y="311" text-anchor="middle" class="small">4. Stomach + lesser sac</text><path d="M995 306 L1038 306" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1044" y="285" width="205" height="42" rx="10" class="flow"/><text x="1146.5" y="311" text-anchor="middle" class="small">5. Duodenum/pancreas</text><path d="M1249 306 L1284 306" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1290" y="285" width="110" height="42" rx="10" class="flow"/><text x="1345.0" y="311" text-anchor="middle" class="small">6. Bowel run</text>
<rect x="880" y="362" width="170" height="42" rx="10" class="flow"/><text x="965.0" y="388" text-anchor="middle" class="small">7. Colon + pelvis</text><path d="M1050 383 L1092 383" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1098" y="362" width="190" height="42" rx="10" class="flow"/><text x="1193.0" y="388" text-anchor="middle" class="small">8. Retroperitoneum</text>
<rect x="790" y="444" width="560" height="54" rx="10" class="pearl"/><text x="812" y="466" class="note">Exposure maneuvers: Kocher = duodenum/IVC; Mattox = aorta;</text><text x="812" y="488" class="note">Cattell-Braasch = right colon/duodenum/cava.</text>
<rect x="44" y="535" width="650" height="350" rx="18" class="panel"/><text x="68" y="573" class="sub">Bowel run</text><text x="68" y="601" class="h">Treitz to Ileocecal Valve, Then Back</text>
<path d="M180 700 C260 625 400 640 430 705 C462 778 365 810 285 770 C218 736 232 685 345 688" fill="none" stroke="url(#bowel)" stroke-width="25" stroke-linecap="round"/>
<text x="118" y="650" class="label">Ligament of Treitz</text><path d="M250 665 L325 690" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="462" y="812" class="label">Ileocecal valve</text><path d="M452 786 L430 758" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M170 852 L555 852" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="832" class="note">Run bowel both directions; inspect mesentery and both sides.</text>
<rect x="746" y="535" width="650" height="350" rx="18" class="panel"/><text x="770" y="573" class="sub">Retroperitoneum and damage control</text><text x="770" y="601" class="h">Zones + Stop/Continue Decision</text>
<ellipse cx="905" cy="676" rx="70" ry="104" class="zone1" opacity=".48"/><text x="874" y="650" class="label">Zone I</text><text x="848" y="676" class="small">central vessels</text>
<ellipse cx="1055" cy="694" rx="72" ry="96" class="zone2" opacity=".48"/><ellipse cx="1210" cy="694" rx="72" ry="96" class="zone2" opacity=".48"/><text x="1014" y="668" class="label">Zone II</text><text x="1170" y="668" class="label">Zone II</text>
<ellipse cx="1065" cy="805" rx="160" ry="54" class="zone3" opacity=".55"/><text x="1026" y="814" class="label">Zone III pelvis</text>
<rect x="790" y="830" width="560" height="50" rx="10" class="danger"/><text x="812" y="860" class="note">Damage control: stop when physiology is failing after bleeding/contamination controlled.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
</svg>