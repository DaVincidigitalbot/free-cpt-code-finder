<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img">
<defs>
<linearGradient id="bowel" x1="0" x2="1"><stop offset="0" stop-color="#f3c7a9"/><stop offset="1" stop-color="#c9836f"/></linearGradient>
<linearGradient id="organ" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7d7bd"/><stop offset="1" stop-color="#b86761"/></linearGradient>
<linearGradient id="muscle" x1="0" x2="1"><stop offset="0" stop-color="#e7a0a0"/><stop offset="1" stop-color="#a94d55"/></linearGradient>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#111827"/></marker>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23577b"/></marker>
<style>
.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#102033}.sub{font:700 14px Inter,Arial,sans-serif;fill:#526173;text-transform:uppercase;letter-spacing:1.2px}.h{font:700 20px Inter,Arial,sans-serif;fill:#102033}.label{font:600 15px Inter,Arial,sans-serif;fill:#132033}.small{font:600 13px Inter,Arial,sans-serif;fill:#263447}.note{font:500 14px Inter,Arial,sans-serif;fill:#344256}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#4b5563}.leader{fill:none;stroke:#1f2937;stroke-width:1.5;marker-end:url(#dot)}.artery{fill:none;stroke:#b91c1c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.vein{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.nerve{fill:none;stroke:#d6a21e;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:7 5}.danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.pearl{fill:#ecfdf5;stroke:#6aa06c;stroke-width:2}.variant{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.flow{fill:#eef6ff;stroke:#23577b;stroke-width:2}.mesh{fill:#dbeafe;stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}.zone1{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.zone2{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.zone3{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.fat{fill:#f6d7a8;stroke:#b7791f;stroke-width:2}.sheath{fill:#e5e7eb;stroke:#475569;stroke-width:2}.pleura{fill:#dff4ff;stroke:#0284c7;stroke-width:2}.skin{fill:#f5c6aa;stroke:#8b4b3f;stroke-width:2}
</style>
</defs>
<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Exploratory Laparotomy: Operative Anatomy Plate</text>
<text x="54" y="80" class="note">Retroperitoneal hematoma zones, exposure maneuvers, Ligament of Treitz, and systematic bowel run.</text>
<rect x="44" y="112" width="650" height="410" rx="18" class="panel"/><text x="68" y="150" class="sub">Retroperitoneal anatomy</text><text x="68" y="178" class="h">Hematoma Zones and What They Mean</text>
<path d="M165 215 C255 170 475 170 575 230 C620 315 610 432 535 488 C405 548 250 532 150 470 C105 374 110 270 165 215Z" fill="#f7d7bd" stroke="#8b4b3f" stroke-width="3"/>
<ellipse cx="360" cy="325" rx="80" ry="140" class="zone1" opacity=".58"/><text x="330" y="306" class="label">Zone I</text><text x="300" y="330" class="small">central / great vessels</text>
<ellipse cx="225" cy="374" rx="82" ry="122" class="zone2" opacity=".55"/><ellipse cx="510" cy="374" rx="82" ry="122" class="zone2" opacity=".55"/><text x="188" y="395" class="label">Zone II</text><text x="472" y="395" class="label">Zone II</text><text x="177" y="420" class="small">perirenal/flank</text><text x="462" y="420" class="small">perirenal/flank</text>
<ellipse cx="365" cy="475" rx="160" ry="58" class="zone3" opacity=".62"/><text x="326" y="486" class="label">Zone III pelvis</text>
<path d="M300 220 C330 250 350 290 358 330" class="artery"/><path d="M415 230 C390 260 378 300 372 338" class="vein"/><text x="92" y="558" class="note">Board rule: mechanism and zone determine exploration. Zone I is usually opened; pelvic hematomas are controlled with packing/IR/fixation strategy.</text>
<rect x="746" y="112" width="650" height="410" rx="18" class="panel"/><text x="770" y="150" class="sub">Exposure maneuvers</text><text x="770" y="178" class="h">How to Open the Retroperitoneum Safely</text>
<rect x="790" y="220" width="250" height="86" rx="14" class="flow"/><text x="818" y="254" class="h">Kocher</text><text x="818" y="282" class="note">Mobilize duodenum</text><text x="818" y="304" class="note">Expose IVC/pancreas head</text>
<rect x="1090" y="220" width="250" height="86" rx="14" class="flow"/><text x="1118" y="254" class="h">Mattox</text><text x="1118" y="282" class="note">Left medial visceral rotation</text><text x="1118" y="304" class="note">Expose aorta/left RP</text>
<rect x="890" y="350" width="340" height="92" rx="14" class="flow"/><text x="918" y="384" class="h">Cattell-Braasch</text><text x="918" y="412" class="note">Medialize right colon + Kocher</text><text x="918" y="434" class="note">Expose cava, duodenum, right RP</text>
<path d="M1015 312 C1010 330 1000 344 980 352" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1170 314 C1162 336 1140 350 1120 358" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="790" y="462" width="560" height="36" rx="9" class="pearl"/><text x="812" y="486" class="note">Exposure is deliberate anatomy, not blind traction.</text>
<rect x="44" y="555" width="650" height="330" rx="18" class="panel"/><text x="68" y="593" class="sub">Systematic bowel run</text><text x="68" y="621" class="h">Ligament of Treitz to Ileocecal Valve</text>
<path d="M150 700 C236 600 405 615 438 690 C478 780 355 832 260 770 C178 716 220 655 350 662" fill="none" stroke="url(#bowel)" stroke-width="26" stroke-linecap="round"/>
<text x="100" y="640" class="label">Ligament of Treitz</text><path d="M242 654 L330 666" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="460" y="806" class="label">Ileocecal valve</text><path d="M450 780 L430 750" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M165 845 L552 845" stroke="#23577b" stroke-width="3" marker-end="url(#arrow)"/><text x="182" y="826" class="note">Run bowel from Treitz to valve, then back; inspect mesentery and both sides.</text>
<rect x="746" y="555" width="650" height="330" rx="18" class="panel"/><text x="770" y="593" class="sub">Operative sequence</text><text x="770" y="621" class="h">Systematic Exploration Checklist</text>
<rect x="790" y="640" width="180" height="40" rx="9" class="flow"/><text x="880.0" y="665" text-anchor="middle" class="small">Hemorrhage control</text><path d="M970 660 L1014 660" stroke="#23577b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1020" y="640" width="190" height="40" rx="9" class="flow"/><text x="1115.0" y="665" text-anchor="middle" class="small">Contamination control</text><path d="M1210 660 L1248 660" stroke="#23577b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1254" y="640" width="105" height="40" rx="9" class="flow"/><text x="1306.5" y="665" text-anchor="middle" class="small">Bowel run</text>
<rect x="840" y="710" width="150" height="40" rx="9" class="flow"/><text x="915.0" y="735" text-anchor="middle" class="small">Colon + pelvis</text><path d="M990 730 L1030 730" stroke="#23577b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1036" y="710" width="210" height="40" rx="9" class="flow"/><text x="1141.0" y="735" text-anchor="middle" class="small">Retroperitoneum by zone</text><path d="M1246 730 L1276 730" stroke="#23577b" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="1282" y="710" width="120" height="40" rx="9" class="flow"/><text x="1342.0" y="735" text-anchor="middle" class="small">Plan takeback</text>
<rect x="790" y="790" width="560" height="62" rx="12" class="danger"/><text x="814" y="818" class="note">Damage control threshold: stop after bleeding/contamination control if physiology is failing.</text><text x="814" y="842" class="note">Definitive repair belongs at takeback, not during lethal triad physiology.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
</svg>