<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Hiatal Hernia Repair Figure B: Circumferential mediastinal dissection</title>
  <desc id="desc">Operative laparoscopic view of hernia sac reduction, circumferential mediastinal dissection, Penrose around the esophagus, pleural danger zones, and esophageal length assessment.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="42%" r="72%"><stop offset="0%" stop-color="#3a211d"/><stop offset="64%" stop-color="#1c100f"/><stop offset="100%" stop-color="#090707"/></radialGradient>
    <linearGradient id="sac" x1="0%" x2="100%"><stop offset="0%" stop-color="#d6d3d1"/><stop offset="50%" stop-color="#f5f5f4"/><stop offset="100%" stop-color="#a8a29e"/></linearGradient>
    <linearGradient id="eso" x1="0%" x2="100%"><stop offset="0%" stop-color="#b96d4d"/><stop offset="50%" stop-color="#f0c28f"/><stop offset="100%" stop-color="#9a4f3d"/></linearGradient>
    <style>.label{font:700 28px Arial,sans-serif;fill:#f8fafc}.small{font:600 21px Arial,sans-serif;fill:#e5e7eb}.tiny{font:600 18px Arial,sans-serif;fill:#e5e7eb}.callout{font:800 25px Arial,sans-serif;fill:#fff7ed}.line{stroke:#f8fafc;stroke-width:5;fill:none;stroke-linecap:round}.vagus{stroke:#facc15;stroke-width:8;fill:none;stroke-linecap:round}.danger{stroke:#93c5fd;stroke-width:5;stroke-dasharray:13 10;fill:none}.plane{stroke:#38bdf8;stroke-width:7;stroke-dasharray:18 12;fill:none}.note{fill:#111827;stroke:#fb923c;stroke-width:4;rx:18}</style>
  </defs>
