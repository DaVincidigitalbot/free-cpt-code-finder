<path d="M990 260 C900 298 878 420 925 514 C960 586 1028 548 1040 470 C1056 370 1042 290 990 260Z" fill="url(#thyroid)" stroke="#70313b" stroke-width="3"/><path d="M1142 260 C1232 298 1254 420 1207 514 C1172 586 1104 548 1092 470 C1076 370 1090 290 1142 260Z" fill="url(#thyroid)" stroke="#70313b" stroke-width="3"/>
<path d="M948 612 C910 530 910 428 944 346 C960 310 982 276 1018 248" class="nerve"/><path d="M1184 612 C1222 530 1222 428 1188 346 C1172 310 1150 276 1114 248" class="nerve"/>
