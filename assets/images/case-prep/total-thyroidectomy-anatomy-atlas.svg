<rect x="790" y="650" width="560" height="210" rx="18" class="pearl"/><text x="818" y="690" class="h">Loss-of-Signal + Hypocalcemia Pathways</text><rect x="818" y="716" width="180" height="42" rx="10" class="flow"/><text x="908.0" y="742" text-anchor="middle" class="small">Symptoms or low Ca</text><path d="M998 747 L1038 747" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1044" y="716" width="130" height="42" rx="10" class="flow"/><text x="1109.0" y="742" text-anchor="middle" class="small">Check PTH</text><path d="M1174 747 L1214 747" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1220" y="716" width="120" height="42" rx="10" class="flow"/><text x="1280.0" y="742" text-anchor="middle" class="small">Calcium + D</text><rect x="930" y="786" width="190" height="42" rx="10" class="flow"/><text x="1025.0" y="812" text-anchor="middle" class="small">Calcitriol if high risk</text><path d="M1090 768 L1020 796" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1145" y="786" width="160" height="42" rx="10" class="flow"/><text x="1225.0" y="812" text-anchor="middle" class="small">Recheck calcium</text><text x="818" y="842" class="note">Loss of signal side 1: troubleshoot, inspect nerve, stage completion.</text>
<rect x="70" y="670" width="590" height="180" rx="18" class="pearl"/><text x="96" y="710" class="h">Postoperative Airway Emergency</text><text x="96" y="742" class="note">Neck swelling/stridor: call help, open incision if threatened.</text><text x="96" y="772" class="note">Bilateral vocal cord dysfunction: secure airway early.</text><text x="96" y="802" class="note">Every structure found on one side must be found again.</text><text x="96" y="832" class="note">Hypocalcemia prevention begins during dissection.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
