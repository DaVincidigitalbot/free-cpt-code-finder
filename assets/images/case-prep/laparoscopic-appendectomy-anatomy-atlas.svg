<style>
.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#102033}.sub{font:700 15px Inter,Arial,sans-serif;fill:#526173;text-transform:uppercase;letter-spacing:1.4px}.h{font:700 21px Inter,Arial,sans-serif;fill:#102033}.label{font:600 16px Inter,Arial,sans-serif;fill:#132033}.small{font:600 13px Inter,Arial,sans-serif;fill:#263447}.note{font:500 15px Inter,Arial,sans-serif;fill:#344256}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#4b5563}.leader{fill:none;stroke:#1f2937;stroke-width:1.5;marker-end:url(#dot)}.artery{fill:none;stroke:#b91c1c;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.vein{fill:none;stroke:#2563eb;stroke-width:6;stroke-linecap:round}.nerve{fill:none;stroke:#d6a21e;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 5}.duct{fill:none;stroke:#7f9b42;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.pearl{fill:#ecfdf5;stroke:#6aa06c;stroke-width:2}.variant{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.flow{fill:#eef6ff;stroke:#23577b;stroke-width:2}.mesh{fill:#dbeafe;stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}.zone1{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.zone2{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.zone3{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}
</style>
</defs>
<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Laparoscopic Appendectomy Anatomy</text>
<text x="54" y="80" class="note">Appendiceal base identification, mesoappendix vascular anatomy, position variants, and difficult-case orientation.</text>
<rect x="44" y="112" width="650" height="510" rx="18" class="panel"/><text x="72" y="154" class="sub">Open anterior orientation</text><text x="72" y="184" class="h">Cecum, taeniae coli, terminal ileum</text>
<path d="M270 275 C200 310 175 410 235 492 C300 582 460 560 502 454 C548 340 420 236 270 275Z" fill="url(#bowel)" stroke="#8b4b3f" stroke-width="3"/>
<path d="M472 408 C560 430 612 484 634 556" fill="none" stroke="url(#bowel)" stroke-width="44" stroke-linecap="round"/>
<path d="M310 305 C350 350 381 400 410 464" fill="none" stroke="#7a3329" stroke-width="4"/><path d="M245 360 C310 382 365 424 420 492" fill="none" stroke="#7a3329" stroke-width="4"/><path d="M230 450 C300 450 365 462 440 506" fill="none" stroke="#7a3329" stroke-width="4"/>
<path d="M438 501 C456 548 438 612 382 658" fill="none" stroke="url(#bowel)" stroke-width="30" stroke-linecap="round"/>
<path d="M416 520 C356 558 320 606 306 672" fill="#f6d7a8" stroke="#b7791f" stroke-width="2"/>
<path d="M430 518 C383 552 350 602 326 662" class="artery"/>
<text x="110" y="260" class="label">Cecum</text><path d="M102 255 C186 240, 186 306, 262 326" class="leader"/><text x="520" y="560" class="label">Terminal ileum</text><path d="M512 555 C555 540, 555 520, 590 540" class="leader"/><text x="330" y="704" class="label">Appendix</text><path d="M322 699 C326 680, 330 662, 335 648" class="leader"/><text x="500" y="470" class="label">Appendiceal base</text><path d="M492 465 C470 462, 456 480, 435 500" class="leader"/><text x="92" y="628" class="label">Mesoappendix</text><path d="M84 623 C205 608, 245 588, 330 600" class="leader"/><text x="500" y="690" class="label">Appendiceal artery</text><path d="M492 685 C435 665, 405 618, 355 600" class="leader"/><text x="102" y="392" class="label">Taeniae coli converge</text><path d="M94 387 C253 372, 253 470, 405 490" class="leader"/>
<rect x="746" y="112" width="650" height="510" rx="18" class="panel"/><text x="774" y="154" class="sub">Laparoscopic operative orientation</text><text x="774" y="184" class="h">Position variants and hidden appendix patterns</text>
<ellipse cx="1035" cy="360" rx="150" ry="118" fill="url(#bowel)" stroke="#8b4b3f" stroke-width="3"/>
<path d="M1012 365 C975 420 962 488 992 560" fill="none" stroke="url(#bowel)" stroke-width="25" stroke-linecap="round"/><text x="892" y="548" class="small">Pelvic appendix</text>
<path d="M1084 328 C1145 285 1176 236 1178 188" fill="none" stroke="url(#bowel)" stroke-width="24" stroke-linecap="round"/><text x="1188" y="205" class="small">Subhepatic appendix</text>
<path d="M1108 388 C1194 384 1260 430 1290 500" fill="none" stroke="url(#bowel)" stroke-width="24" stroke-linecap="round"/><text x="1194" y="538" class="small">Paracecal appendix</text>
<path d="M988 315 C924 298 877 330 854 390" fill="none" stroke="#a56a58" stroke-width="25" stroke-linecap="round" opacity=".45"/><text x="808" y="420" class="small">Retrocecal: hidden behind cecum</text>
<path d="M937 340 C994 350 1050 374 1097 410" fill="none" stroke="#7a3329" stroke-width="4"/><path d="M930 380 C990 382 1050 398 1110 434" fill="none" stroke="#7a3329" stroke-width="4"/><path d="M960 420 C1000 405 1052 412 1116 452" fill="none" stroke="#7a3329" stroke-width="4"/>
<text x="1178" y="420" class="label">Appendiceal base</text><path d="M1170 415 C1142 400, 1142 420, 1106 440" class="leader"/><text x="812" y="326" class="label">Taeniae coli</text><path d="M804 321 C893 306, 893 350, 975 370" class="leader"/><text x="804" y="282" class="label">Retrocecal appendix</text><path d="M796 277 C852 262, 852 302, 900 322" class="leader"/>
<rect x="760" y="650" width="590" height="222" rx="18" class="pearl"/><text x="788" y="690" class="h">Finding the Appendix During a Difficult Case</text>
<rect x="790" y="720" width="190" height="42" rx="10" class="flow"/><text x="885" y="746" text-anchor="middle" class="small">Cannot identify appendix</text><path d="M980 741 L1015 741" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1020" y="720" width="150" height="42" rx="10" class="flow"/><text x="1095" y="746" text-anchor="middle" class="small">Locate cecum</text><path d="M1170 741 L1205 741" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1210" y="720" width="160" height="42" rx="10" class="flow"/><text x="1290" y="746" text-anchor="middle" class="small">Identify taeniae coli</text>
<rect x="908" y="790" width="190" height="42" rx="10" class="flow"/><text x="1003.0" y="816" text-anchor="middle" class="small">Follow convergence</text><path d="M1210 762 L1060 790" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1003 790 L1003 824" stroke="#23577b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="908" y="830" width="220" height="42" rx="10" class="flow"/><text x="1018.0" y="856" text-anchor="middle" class="small">Appendiceal base identified</text>
<text x="84" y="700" class="h">Retrocecal Appendix Strategy</text><rect x="70" y="724" width="590" height="166" rx="14" class="pearl"/><text x="94" y="754" class="note">1. Do not dig blindly behind the cecum.</text><text x="94" y="784" class="note">2. Follow taeniae coli to the base, then mobilize cecum laterally.</text><text x="94" y="814" class="note">3. Develop the white line only as needed for exposure.</text><text x="94" y="844" class="note">4. Control mesoappendix close to appendix; protect terminal ileum.</text><text x="94" y="874" class="note">Pelvic appendices frequently drape into the pelvis.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
</svg>