<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 3200" role="img" aria-labelledby="title desc">
  <title id="title">Transversus Abdominis Release Anatomy Atlas</title>
  <desc id="desc">Mobile-responsive surgical atlas of TAR anatomy: abdominal wall layers, retrorectus space, posterior sheath, linea semilunaris, neurovascular bundles, TAR release plane, mesh planes, and bailout triggers.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font:700 26px Arial,sans-serif;fill:#0b1f3a}.sub{font:500 16px Arial,sans-serif;fill:#334155}.h2{font:700 23px Arial,sans-serif;fill:#0b1f3a}.label{font:700 18px Arial,sans-serif;fill:#102033}.small{font:500 16px Arial,sans-serif;fill:#334155}.tiny{font:600 14px Arial,sans-serif;fill:#475569}.note{font:700 17px Arial,sans-serif;fill:#7c2d12}.skin{fill:#f4c6b8;stroke:#9f1239;stroke-width:1.5}.subq{fill:#fde68a;stroke:#ca8a04;stroke-width:1.5}.external{fill:#f8c7a2;stroke:#b45309;stroke-width:2}.internal{fill:#e9a66f;stroke:#92400e;stroke-width:2}.trans{fill:#c67c4e;stroke:#7c2d12;stroke-width:2}.rectus{fill:#d16f5f;stroke:#7f1d1d;stroke-width:2}.post{fill:#fff7ed;stroke:#9a3412;stroke-width:3}.perit{fill:#fef3c7;stroke:#a16207;stroke-width:2}.space{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.mesh{fill:url(#mesh);stroke:#1d4ed8;stroke-width:2}.safe{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.bad{fill:#fee2e2;stroke:#dc2626;stroke-width:2}.danger{stroke:#dc2626;stroke-width:4;fill:none;stroke-dasharray:8 7}.cut{stroke:#dc2626;stroke-width:5;fill:none}.nerve{stroke:#facc15;stroke-width:5;fill:none}.vessel{stroke:#2563eb;stroke-width:4;fill:none}.arrow{stroke:#1e3a8a;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e3a8a"/></marker>
    <pattern id="mesh" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#dbeafe"/><path d="M0 0 L18 18 M18 0 L0 18" stroke="#2563eb" stroke-width="1.2" opacity=".65"/></pattern>
  </defs>
  <rect class="bg" width="820" height="3200"/>
  <text x="40" y="55" class="head">TAR Anatomy Atlas</text>
  <text x="40" y="84" class="sub">Transversus abdominis release for abdominal wall reconstruction.</text>
  <text x="40" y="110" class="sub">Goal: safe plane, posterior layer integrity, durable extraperitoneal mesh.</text>

  <rect x="35" y="145" width="750" height="455" rx="10" class="panel"/>
  <text x="65" y="185" class="h2">A. Abdominal Wall Cross-Section</text>
  <g transform="translate(70 222)">
    <rect x="0" y="0" width="360" height="32" rx="4" class="skin"/><text x="455" y="22" class="label">Skin</text>
    <rect x="0" y="48" width="360" height="40" rx="4" class="subq"/><text x="455" y="74" class="label">Subcutaneous tissue</text>
    <rect x="0" y="126" width="70" height="122" rx="8" class="external"/><text x="455" y="128" class="small">External oblique</text>
    <rect x="70" y="136" width="70" height="104" rx="8" class="internal"/><text x="455" y="158" class="small">Internal oblique</text>
    <rect x="140" y="146" width="68" height="86" rx="8" class="trans"/><text x="455" y="188" class="small">Transversus</text>
    <rect x="230" y="118" width="58" height="142" rx="18" class="rectus"/><text x="455" y="218" class="small">Rectus muscle</text>
    <path d="M218 126 C198 166 198 216 218 254" class="post"/><path d="M300 126 C320 166 320 216 300 254" class="post"/>
    <rect x="230" y="278" width="58" height="28" rx="5" class="space"/><text x="455" y="248" class="small">Posterior sheath</text>
    <text x="455" y="278" class="small">Retrorectus space</text>
    <path d="M230 326 C210 346 216 370 244 378 C280 388 318 362 294 340 C280 326 258 322 230 326" class="perit"/>
    <text x="455" y="308" class="small">Peritoneum / viscera</text>
    <path d="M140 114 L140 258" class="danger"/><path d="M360 114 L360 258" class="danger"/>
    <text x="82" y="108" class="note">Linea semilunaris</text>
    <path d="M76 154 C106 148 132 148 158 153" class="nerve"/><path d="M78 174 C106 168 132 168 158 173" class="vessel"/>
    <rect x="0" y="392" width="650" height="32" rx="6" class="warn"/>
    <text x="14" y="414" class="tiny">Yellow/blue lines: lateral neurovascular bundles entering rectus - preserve them.</text>
  </g>

  <rect x="35" y="640" width="750" height="520" rx="10" class="panel"/>
  <text x="65" y="680" class="h2">B. Posterior View: TAR Extends Retrorectus Repair</text>
  <g transform="translate(70 725)">
    <rect x="125" y="35" width="175" height="210" rx="24" class="rectus"/><rect x="390" y="35" width="175" height="210" rx="24" class="rectus"/>
    <path d="M212 48 C188 90 188 190 212 232" class="post"/><path d="M478 48 C502 90 502 190 478 232" class="post"/>
    <rect x="230" y="80" width="235" height="140" rx="16" class="space"/>
    <rect x="165" y="92" width="365" height="115" rx="18" class="mesh"/>
    <text x="205" y="72" class="label">Retromuscular / preperitoneal mesh</text>
    <path d="M105 20 L105 270" class="danger"/><path d="M585 20 L585 270" class="danger"/>
    <text x="42" y="306" class="note">Linea semilunaris</text><text x="500" y="306" class="note">Linea semilunaris</text>
    <path d="M165 118 C88 130 52 180 34 238" class="cut"/><path d="M528 118 C605 130 642 180 660 238" class="cut"/>
    <text x="34" y="268" class="note">TAR</text><text x="34" y="292" class="note">release</text>
    <text x="594" y="268" class="note">TAR</text><text x="584" y="292" class="note">release</text>
    <path d="M48 142 C84 134 116 134 154 140" class="nerve"/><path d="M642 142 C606 134 574 134 536 140" class="nerve"/>
    <rect x="55" y="355" width="585" height="72" rx="8" class="safe"/>
    <text x="75" y="383" class="small">Pearl: TAR creates lateral extraperitoneal working room</text>
    <text x="75" y="410" class="small">without raising broad anterior skin flaps.</text>
  </g>

  <rect x="35" y="1200" width="750" height="330" rx="10" class="panel"/>
  <text x="65" y="1240" class="h2">C. Mesh Plane Comparison</text>
  <g transform="translate(70 1280)">
    <rect x="0" y="0" width="650" height="48" rx="8" class="warn"/><text x="18" y="30" class="label">Onlay</text><text x="180" y="30" class="small">subcutaneous, more wound/seroma exposure</text>
    <rect x="0" y="68" width="650" height="48" rx="8" class="safe"/><text x="18" y="98" class="label">Retrorectus</text><text x="180" y="98" class="small">workhorse extraperitoneal plane</text>
    <rect x="0" y="136" width="650" height="48" rx="8" class="safe"/><text x="18" y="166" class="label">Preperitoneal</text><text x="180" y="166" class="small">TAR extension for wide overlap</text>
    <rect x="0" y="204" width="650" height="48" rx="8" class="bad"/><text x="18" y="234" class="label">Intraperitoneal</text><text x="180" y="234" class="small">visceral interface concern</text>
  </g>

  <rect x="35" y="1570" width="750" height="370" rx="10" class="panel"/>
  <text x="65" y="1610" class="h2">D. TAR Decision Framework</text>
  <g transform="translate(85 1650)">
    <rect x="0" y="0" width="600" height="45" rx="8" class="safe"/><text x="18" y="29" class="label">Need medial advancement?</text>
    <path d="M300 47 L300 72" class="arrow"/>
    <rect x="0" y="75" width="600" height="45" rx="8" class="safe"/><text x="18" y="104" class="label">Retrorectus repair alone insufficient?</text>
    <path d="M300 122 L300 147" class="arrow"/>
    <rect x="0" y="150" width="600" height="45" rx="8" class="safe"/><text x="18" y="179" class="label">Clean field and tolerable physiology?</text>
    <path d="M300 197 L300 222" class="arrow"/>
    <rect x="0" y="225" width="600" height="45" rx="8" class="safe"/><text x="18" y="254" class="label">TAR + broad extraperitoneal mesh</text>
    <text x="0" y="315" class="note">If dirty field, failed posterior layer, or closure intolerance:</text>
    <text x="0" y="342" class="note">stage or change plan.</text>
  </g>

  <rect x="35" y="1980" width="750" height="315" rx="10" class="panel"/>
  <text x="65" y="2020" class="h2">E. Bailout Triggers</text>
  <g transform="translate(70 2060)">
    <rect x="0" y="0" width="310" height="70" rx="8" class="bad"/><text x="18" y="28" class="label">Enterotomy</text><text x="18" y="53" class="small">Reassess wound class.</text>
    <rect x="340" y="0" width="310" height="70" rx="8" class="bad"/><text x="358" y="28" class="label">Posterior failure</text><text x="358" y="53" class="small">Barrier, plane, or stage.</text>
    <rect x="0" y="95" width="310" height="70" rx="8" class="bad"/><text x="18" y="123" class="label">Closure intolerance</text><text x="18" y="148" class="small">Physiology wins.</text>
    <rect x="340" y="95" width="310" height="70" rx="8" class="bad"/><text x="358" y="123" class="label">Infected mesh/fistula</text><text x="358" y="148" class="small">Source control first.</text>
    <text x="0" y="225" class="note">Attending pearl: choose the plane first.</text>
    <text x="0" y="252" class="note">Mesh type follows field, anatomy, and physiology.</text>
  </g>
</svg>

