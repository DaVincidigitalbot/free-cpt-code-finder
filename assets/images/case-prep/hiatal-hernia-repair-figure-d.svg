<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Hiatal Hernia Repair Figure D: Posterior cruroplasty, mesh, gastropexy, and failure modes</title>
  <desc id="desc">Operative laparoscopic view of posterior crural closure, selective mesh reinforcement, gastropexy fixation points, and common recurrence mechanisms.</desc>
