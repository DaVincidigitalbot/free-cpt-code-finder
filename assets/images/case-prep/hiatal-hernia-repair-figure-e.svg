<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Hiatal Hernia Repair Figure E: Nissen fundoplication orientation</title>
  <desc id="desc">Independent operative figure showing Nissen 360 degree fundoplication orientation around the distal esophagus after hiatal repair.</desc>
  <defs><radialGradient id="field" cx="50%" cy="42%" r="72%"><stop offset="0%" stop-color="#3a211d"/><stop offset="62%" stop-color="#1c100f"/><stop offset="100%" stop-color="#090707"/></radialGradient><style>.label{font:700 28px Arial,sans-serif;fill:#f8fafc}.small{font:600 21px Arial,sans-serif;fill:#e5e7eb}.tiny{font:600 18px Arial,sans-serif;fill:#e5e7eb}.callout{font:800 25px Arial,sans-serif;fill:#fff7ed}.line{stroke:#f8fafc;stroke-width:5;fill:none;stroke-linecap:round}.wrap{fill:#b45309;stroke:#fed7aa;stroke-width:7}.vagus{stroke:#facc15;stroke-width:8;fill:none;stroke-linecap:round}.note{fill:#111827;stroke:#fb923c;stroke-width:4;rx:18}</style></defs>
  <rect width="1440" height="980" fill="url(#field)"/>
  <text x="52" y="62" class="label">Figure E - Nissen Fundoplication, 360 Degree Wrap</text>
