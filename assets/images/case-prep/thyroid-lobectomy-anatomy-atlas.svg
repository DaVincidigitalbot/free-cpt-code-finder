<rect x="1018" y="245" width="76" height="330" rx="30" fill="#d9e2e7" stroke="#687583" stroke-width="3"/><text x="1108" y="418" class="label">Trachea</text>
<path d="M960 250 C870 284 848 410 894 508 C930 590 1008 550 1026 470 C1046 382 1030 276 960 250Z" fill="url(#thyroid)" stroke="#70313b" stroke-width="3"/>
<ellipse cx="1015" cy="375" rx="34" ry="26" fill="#9b4b49" stroke="#70313b" stroke-width="3"/><text x="1048" y="364" class="label">Tubercle of Zuckerkandl</text>
<path d="M1008 418 C1042 422 1065 432 1090 452" fill="none" stroke="#6b2d33" stroke-width="10"/><text x="1100" y="468" class="label">Ligament of Berry</text>
