<path d="M890 504 C842 518 810 550 786 590" class="artery"/><text x="790" y="620" class="label">Inferior thyroid artery</text>
<rect x="830" y="680" width="500" height="142" rx="18" class="danger"/><text x="858" y="720" class="h">Danger Zones</text><text x="858" y="754" class="note">Upper pole: EBSLN and superior vessels.</text><text x="858" y="784" class="note">Berry ligament: RLN tethered near entry.</text><text x="858" y="814" class="note">Inferior pole: preserve parathyroid blood supply.</text>
<rect x="70" y="680" width="590" height="142" rx="18" class="pearl"/><text x="96" y="720" class="h">Teaching Pearls</text><text x="96" y="754" class="note">RLN is most commonly injured near Berry's ligament.</text><text x="96" y="784" class="note">Zuckerkandl tubercle often points toward the RLN.</text><text x="96" y="814" class="note">Preserve parathyroid blood supply whenever possible.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
