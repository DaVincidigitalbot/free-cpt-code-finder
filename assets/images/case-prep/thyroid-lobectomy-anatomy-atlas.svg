<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Thyroid Lobectomy Anatomy</text>
<text x="54" y="80" class="note">Endocrine surgery orientation, recurrent nerve landmarks, parathyroid preservation, and danger zones.</text>
<rect x="44" y="112" width="650" height="520" rx="18" class="panel"/><text x="72" y="154" class="sub">Anterior neck orientation</text><text x="72" y="184" class="h">Thyroid lobe, airway, vessels</text>
