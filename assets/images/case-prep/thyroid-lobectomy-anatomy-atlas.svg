<circle cx="945" cy="330" r="15" fill="#f5d06f" stroke="#9a6a00" stroke-width="2"/><text x="790" y="324" class="label">Superior parathyroid</text>
<circle cx="930" cy="520" r="15" fill="#f5d06f" stroke="#9a6a00" stroke-width="2"/><text x="790" y="530" class="label">Inferior parathyroid</text>
