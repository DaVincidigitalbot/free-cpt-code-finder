<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23577b"/></marker>
<style>
.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#102033}.sub{font:700 14px Inter,Arial,sans-serif;fill:#526173;text-transform:uppercase;letter-spacing:1.2px}.h{font:700 20px Inter,Arial,sans-serif;fill:#102033}.label{font:600 15px Inter,Arial,sans-serif;fill:#132033}.small{font:600 13px Inter,Arial,sans-serif;fill:#263447}.note{font:500 14px Inter,Arial,sans-serif;fill:#344256}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#4b5563}.leader{fill:none;stroke:#1f2937;stroke-width:1.5;marker-end:url(#dot)}.artery{fill:none;stroke:#b91c1c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.vein{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.nerve{fill:none;stroke:#d6a21e;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:7 5}.danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.pearl{fill:#ecfdf5;stroke:#6aa06c;stroke-width:2}.variant{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.flow{fill:#eef6ff;stroke:#23577b;stroke-width:2}.mesh{fill:#dbeafe;stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}.zone1{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.zone2{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.zone3{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.fat{fill:#f6d7a8;stroke:#b7791f;stroke-width:2}.sheath{fill:#e5e7eb;stroke:#475569;stroke-width:2}.pleura{fill:#dff4ff;stroke:#0284c7;stroke-width:2}.skin{fill:#f5c6aa;stroke:#8b4b3f;stroke-width:2}
</style>
</defs>
<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Chest Tube Placement: Thoracic Wall Anatomy Plate</text>
<text x="54" y="80" class="note">Chest wall cross-section, rib numbering, intercostal bundle, pleura/lung entry, air-versus-fluid positioning, and massive hemothorax callout.</text>
<rect x="44" y="112" width="650" height="390" rx="18" class="panel"/><text x="68" y="150" class="sub">Surface anatomy</text><text x="68" y="178" class="h">Safe Triangle and Rib Counting</text>
<path d="M185 210 C325 158 500 182 575 320 C615 405 550 480 420 500 C280 522 160 475 135 405 C110 320 128 250 185 210Z" fill="#f0c1a5" stroke="#8b4b3f" stroke-width="3"/>
<path d="M300 220 C318 300 316 400 292 486" fill="none" stroke="#a94d55" stroke-width="40" stroke-linecap="round"/><text x="95" y="246" class="label">Pectoralis major</text>
<path d="M458 250 C420 330 412 420 446 500" fill="none" stroke="#b85d66" stroke-width="38" stroke-linecap="round"/><text x="502" y="290" class="label">Serratus anterior</text>
<path d="M548 300 C508 365 500 430 526 500" fill="none" stroke="#7f1d1d" stroke-width="38" stroke-linecap="round"/><text x="500" y="500" class="label">Latissimus dorsi</text>
<path d="M250 382 L510 318 L548 496 L320 552 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3" stroke-dasharray="9 7"/><text x="335" y="420" class="label">Safe Triangle</text>
<path d="M205 390 C315 378 430 384 540 404" fill="none" stroke="#94a3b8" stroke-width="5"/><text x="470" y="398" class="small">4th rib</text>
<path d="M205 425 C315 412 430 420 540 440" fill="none" stroke="#64748b" stroke-width="8"/><text x="95" y="462" class="label">5th intercostal space</text><text x="470" y="438" class="small">5th rib</text>
<path d="M205 458 C315 448 430 456 540 474" fill="none" stroke="#94a3b8" stroke-width="5"/><text x="470" y="474" class="small">6th rib</text>
<path d="M360 205 L360 500" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8"/><text x="372" y="214" class="label">Mid-axillary line</text>
<rect x="746" y="112" width="650" height="390" rx="18" class="panel"/><text x="770" y="150" class="sub">Chest wall cross-section</text><text x="770" y="178" class="h">Skin to Pleural Space</text>
<rect x="810" y="220" width="370" height="28" rx="8" class="skin"/><text x="1205" y="240" class="label">Skin</text>
<rect x="810" y="262" width="370" height="32" rx="8" class="fat"/><text x="1205" y="284" class="label">Subcutaneous tissue</text>
<rect x="810" y="308" width="370" height="36" rx="8" fill="#b85d66" stroke="#334155"/><text x="1205" y="331" class="label">Intercostal muscles</text>
<path d="M835 394 C940 372 1050 372 1160 394" fill="none" stroke="#f8fafc" stroke-width="34"/><path d="M835 394 C940 372 1050 372 1160 394" fill="none" stroke="#64748b" stroke-width="8"/><text x="790" y="400" class="label">Rib</text>
<path d="M835 430 C940 410 1050 410 1160 430" class="vein"/><path d="M835 448 C940 428 1050 428 1160 448" class="artery"/><path d="M835 466 C940 446 1050 446 1160 466" class="nerve"/><text x="1180" y="432" class="small">Intercostal vein</text><text x="1180" y="452" class="small">Intercostal artery</text><text x="1180" y="472" class="small">Intercostal nerve</text>
<rect x="810" y="474" width="370" height="24" rx="8" class="pleura"/><text x="1205" y="494" class="label">Pleura</text>
<path d="M900 515 C1015 485 1140 520 1155 600 C1170 685 1050 720 955 685 C885 658 865 575 900 515Z" fill="#f5a6a6" opacity=".50" stroke="#b91c1c" stroke-width="3"/><text x="1080" y="705" class="label">Lung</text>
<text x="790" y="530" class="note">Finger thoracostomy confirms pleural entry before tube advancement.</text>
<rect x="44" y="535" width="650" height="330" rx="18" class="panel"/><text x="68" y="573" class="sub">Air versus fluid positioning</text><text x="68" y="601" class="h">Tube Direction After Pleural Entry</text>
<path d="M120 750 C240 660 350 605 512 590" stroke="#23577b" stroke-width="8" marker-end="url(#arrow)" opacity=".78"/><text x="110" y="630" class="h">Pneumothorax</text><text x="110" y="660" class="note">Aim anterior and apical for air.</text>
<path d="M130 785 C260 795 420 795 560 742" stroke="#0f766e" stroke-width="8" marker-end="url(#arrow)" opacity=".78"/><text x="110" y="820" class="h">Hemothorax</text><text x="110" y="846" class="note">Aim posterior/basal for blood or fluid.</text>
<rect x="746" y="535" width="650" height="330" rx="18" class="panel"/><text x="770" y="573" class="sub">Massive hemothorax</text><text x="770" y="601" class="h">When Drainage Becomes an Operation</text>
<rect x="790" y="620" width="560" height="150" rx="18" class="danger"/><text x="820" y="660" class="h">Massive Hemothorax Callout</text><text x="820" y="696" class="note">Classic trigger: >1500 mL immediate output or >200 mL/hr.</text><text x="820" y="728" class="note">Physiology overrides numbers: resuscitate, call attending, prepare OR.</text><text x="820" y="760" class="note">Do not let a draining tube delay hemorrhage control.</text>
<rect x="790" y="805" width="560" height="42" rx="10" class="pearl"/><text x="812" y="832" class="note">Walk over superior rib border; neurovascular bundle runs below each rib.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
</svg>