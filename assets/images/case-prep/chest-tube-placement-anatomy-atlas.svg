<text x="54" y="52" class="title">Chest Tube Placement Anatomy</text>
<text x="54" y="80" class="note">Safe triangle, layered thoracic wall anatomy, intercostal bundle, pleural entry, and tube direction.</text>
<rect x="44" y="112" width="650" height="520" rx="18" class="panel"/><text x="72" y="154" class="sub">Surface anatomy</text><text x="72" y="184" class="h">Safe triangle and fifth intercostal space</text>
<path d="M180 210 C330 150 520 175 600 335 C650 440 580 570 430 610 C270 650 135 560 112 420 C96 320 122 250 180 210Z" fill="#f0c1a5" stroke="#8b4b3f" stroke-width="3"/>
<path d="M310 210 C330 310 324 440 290 560" fill="none" stroke="#a94d55" stroke-width="44" stroke-linecap="round"/><text x="98" y="250" class="label">Pectoralis major</text>
<path d="M470 250 C415 350 405 470 452 584" fill="none" stroke="#b85d66" stroke-width="42" stroke-linecap="round"/><text x="502" y="290" class="label">Serratus anterior</text>
