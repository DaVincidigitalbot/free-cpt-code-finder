<path d="M890 300 C1030 255 1215 315 1240 462 C1265 594 1112 648 990 598 C905 562 858 440 890 300Z" fill="#f5a6a6" opacity=".45" stroke="#b91c1c" stroke-width="3"/><text x="1080" y="610" class="label">Lung</text>
