<rect x="820" y="210" width="360" height="30" rx="8" fill="#f5c6aa" stroke="#334155"/><text x="1200" y="232" class="small">Skin</text>
<rect x="820" y="258" width="360" height="30" rx="8" fill="#f6d7a8" stroke="#334155"/><text x="1200" y="280" class="small">Subcutaneous tissue</text>
<rect x="820" y="306" width="360" height="30" rx="8" fill="#a94d55" stroke="#334155"/><text x="1200" y="328" class="small">Latissimus dorsi</text>
<rect x="820" y="354" width="360" height="30" rx="8" fill="#b85d66" stroke="#334155"/><text x="1200" y="376" class="small">Serratus anterior</text><rect x="820" y="402" width="360" height="30" rx="8" fill="#d98282" stroke="#334155"/><text x="1200" y="424" class="small">Intercostal muscle</text><rect x="820" y="536" width="360" height="30" rx="8" fill="#e0f2fe" stroke="#334155"/><text x="1200" y="558" class="small">Parietal pleura</text>
<path d="M850 430 C940 410 1040 410 1140 430" fill="none" stroke="#f8fafc" stroke-width="32"/><path d="M850 430 C940 410 1040 410 1140 430" fill="none" stroke="#64748b" stroke-width="7"/><text x="806" y="436" class="label">Rib</text>
