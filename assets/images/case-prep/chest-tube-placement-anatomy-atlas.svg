<path d="M810 360 C900 330 960 310 1030 286" stroke="#23577b" stroke-width="5" opacity=".75" marker-end="url(#arrow)"/><text x="790" y="324" class="label">Pneumothorax</text><text x="790" y="348" class="note">direct anterior/apical</text>
<path d="M820 560 C930 582 1035 604 1140 626" stroke="#23577b" stroke-width="5" opacity=".75" marker-end="url(#arrow)"/><text x="790" y="604" class="label">Hemothorax</text><text x="790" y="628" class="note">direct posterior/basal</text>
<rect x="70" y="680" width="590" height="150" rx="18" class="pearl"/><text x="96" y="720" class="h">Teaching Pearls</text><text x="96" y="754" class="note">Walk over the superior aspect of the rib.</text><text x="96" y="784" class="note">Neurovascular bundle runs beneath the rib.</text><text x="96" y="814" class="note">Finger thoracostomy confirms pleural entry.</text>
<rect x="790" y="704" width="560" height="126" rx="18" class="danger"/><text x="818" y="744" class="h">Avoid</text><text x="818" y="778" class="note">Low placement: diaphragm/liver/spleen injury risk.</text><text x="818" y="808" class="note">Forceful advancement: subcutaneous track or lung injury.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
