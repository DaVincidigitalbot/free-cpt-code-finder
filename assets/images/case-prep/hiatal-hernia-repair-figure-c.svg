<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Hiatal Hernia Repair Figure C: Short esophagus decision atlas</title>
  <desc id="desc">Decision atlas comparing adequate length, inadequate length after mediastinal mobilization, true short esophagus, Collis consideration, and recurrence from tension.</desc>
  <defs><radialGradient id="field" cx="50%" cy="44%" r="72%"><stop offset="0%" stop-color="#3a211d"/><stop offset="62%" stop-color="#1c100f"/><stop offset="100%" stop-color="#090707"/></radialGradient><linearGradient id="eso" x1="0%" x2="100%"><stop offset="0%" stop-color="#b96d4d"/><stop offset="50%" stop-color="#f0c28f"/><stop offset="100%" stop-color="#9a4f3d"/></linearGradient><style>.label{font:700 28px Arial,sans-serif;fill:#f8fafc}.small{font:600 21px Arial,sans-serif;fill:#e5e7eb}.tiny{font:600 18px Arial,sans-serif;fill:#e5e7eb}.callout{font:800 25px Arial,sans-serif;fill:#fff7ed}.ok{stroke:#22c55e;stroke-width:8;fill:none}.bad{stroke:#ef4444;stroke-width:8;fill:none;stroke-dasharray:16 10}.line{stroke:#f8fafc;stroke-width:5;fill:none;stroke-linecap:round}.note{fill:#111827;stroke:#fb923c;stroke-width:4;rx:18}</style></defs>
  <rect width="1440" height="980" fill="url(#field)"/>
  <text x="52" y="62" class="label">Figure C - Short Esophagus Decision Atlas</text>
  <g transform="translate(1032 20)"><rect width="330" height="102" rx="14" fill="#111827" stroke="#64748b" stroke-width="3"/><text x="20" y="30" class="tiny">OPERATIVE ORIENTATION</text><text x="20" y="60" class="tiny">Anterior top / posterior deep</text><text x="20" y="88" class="tiny">Patient R &lt;-  -&gt; Patient L</text></g>
  <g transform="translate(72 152)"><rect width="392" height="520" rx="22" fill="#1f2937" stroke="#475569" stroke-width="3"/><text x="28" y="44" class="label">Adequate length</text><path d="M196 74 C196 184 196 270 208 358" fill="none" stroke="url(#eso)" stroke-width="58" stroke-linecap="round"/><path d="M96 322 C176 292 252 292 328 322" stroke="#c86d58" stroke-width="34" fill="none"/><path d="M110 388 C190 430 266 420 328 380" fill="#b45309" stroke="#fed7aa" stroke-width="5"/><path d="M70 300 C150 276 242 276 326 300" class="ok"/><path d="M198 308 L198 392" class="ok"/><text x="230" y="360" class="small">2.5-3 cm below crura</text><text x="28" y="480" class="small">Build repair without tension.</text></g>
  <g transform="translate(524 152)"><rect width="392" height="520" rx="22" fill="#1f2937" stroke="#475569" stroke-width="3"/><text x="28" y="44" class="label">After mobilization</text><path d="M196 74 C194 184 194 268 198 318" fill="none" stroke="url(#eso)" stroke-width="58" stroke-linecap="round"/><path d="M72 318 C150 292 242 292 326 318" class="bad"/><path d="M110 390 C190 430 266 420 328 382" fill="#b45309" stroke="#fed7aa" stroke-width="5"/><path d="M198 312 L198 356" class="bad"/><text x="232" y="340" class="small">GEJ at hiatus</text><text x="28" y="462" class="small">Do not call this adequate just</text><text x="28" y="492" class="small">because the stomach reduced.</text></g>
  <g transform="translate(976 152)"><rect width="392" height="520" rx="22" fill="#1f2937" stroke="#475569" stroke-width="3"/><text x="28" y="44" class="label">True short esophagus</text><path d="M196 74 C194 174 194 238 196 286" fill="none" stroke="url(#eso)" stroke-width="58" stroke-linecap="round"/><path d="M72 318 C150 292 242 292 326 318" class="bad"/><path d="M120 398 C194 438 264 428 322 390" fill="#b45309" stroke="#fed7aa" stroke-width="5"/><path d="M198 286 L198 344" stroke="#ef4444" stroke-width="10" marker-end="url(#none)"/><text x="226" y="310" class="small">Tension vector</text><text x="28" y="462" class="small">Consider Collis or alternate</text><text x="28" y="492" class="small">strategy after real mobilization.</text></g>
  <g transform="translate(124 730)"><rect class="note" width="1192" height="150"/><text x="28" y="45" class="callout">Operative judgment</text><text x="28" y="84" class="small">Most recurrences begin with tension.</text><text x="28" y="118" class="small">Do not build a wrap on an esophagus that is trying to live in the chest.</text></g>
</svg>
