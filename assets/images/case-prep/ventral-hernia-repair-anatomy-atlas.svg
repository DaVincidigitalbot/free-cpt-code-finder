<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Ventral Hernia Repair: Abdominal Wall Reconstruction Atlas</text>
<text x="54" y="80" class="note">Flagship plate: layered abdominal wall anatomy, retrorectus plane, posterior sheath, linea semilunaris, neurovascular bundles, TAR, mesh planes, and enterotomy risk.</text>
<rect x="44" y="112" width="650" height="395" rx="18" class="panel"/><text x="68" y="150" class="sub">Layered cross-section</text><text x="68" y="178" class="h">Abdominal Wall Layers and Mesh Planes</text>
<rect x="98" y="205" width="470" height="26" rx="8" fill="#f5c6aa" stroke="#334155"/><text x="92" y="196" class="label">Skin</text>
<rect x="118" y="241" width="470" height="30" rx="8" fill="#f6d7a8" stroke="#334155"/><text x="92" y="258" class="label">Subcutaneous tissue</text>
<rect x="138" y="281" width="470" height="30" rx="8" fill="#d98282" stroke="#334155"/><text x="92" y="302" class="label">External oblique</text>
<rect x="158" y="321" width="470" height="30" rx="8" fill="#c96f76" stroke="#334155"/><text x="92" y="342" class="label">Internal oblique</text>
<rect x="178" y="361" width="470" height="30" rx="8" fill="#b85d66" stroke="#334155"/><text x="92" y="382" class="label">Transversus abdominis</text>
<rect x="250" y="405" width="120" height="118" rx="38" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/><text x="98" y="560" class="label">Rectus muscle</text>
<rect x="388" y="418" width="205" height="26" rx="8" fill="#e5e7eb" stroke="#475569"/><text x="590" y="438" class="label">Posterior sheath</text>
<rect x="420" y="462" width="190" height="26" rx="8" fill="#fefce8" stroke="#a16207"/><text x="590" y="482" class="label">Preperitoneal fat</text>
<rect x="450" y="505" width="150" height="24" rx="8" fill="#f8fafc" stroke="#475569"/><text x="590" y="523" class="label">Peritoneum</text>
<rect x="195" y="236" width="92" height="34" rx="9" class="mesh"/><text x="212" y="258" class="small">Onlay</text>
<rect x="110" y="535" width="92" height="34" rx="9" class="danger"/><text x="130" y="557" class="small">Inlay</text>
<rect x="338" y="390" width="140" height="36" rx="9" class="mesh"/><text x="354" y="414" class="small">Sublay / Retrorectus</text>
<rect x="420" y="468" width="120" height="34" rx="9" class="mesh"/><text x="430" y="491" class="small">Preperitoneal</text>
<rect x="250" y="548" width="150" height="34" rx="9" class="mesh"/><text x="276" y="571" class="small">Intraperitoneal</text>
<rect x="746" y="112" width="650" height="395" rx="18" class="panel"/><text x="770" y="150" class="sub">Retromuscular operative view</text><text x="770" y="178" class="h">Retrorectus Space, Linea Semilunaris, Nerves</text>
<rect x="865" y="210" width="130" height="260" rx="42" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/><rect x="1142" y="210" width="130" height="260" rx="42" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/>
<path d="M997 225 L1140 225 L1140 472 L997 472 Z" fill="#e5e7eb" stroke="#475569" stroke-width="3"/><text x="1034" y="355" class="label">Posterior sheath</text>
<path d="M852 205 L852 488" stroke="#9333ea" stroke-width="5" stroke-dasharray="10 8"/><path d="M1284 205 L1284 488" stroke="#9333ea" stroke-width="5" stroke-dasharray="10 8"/>
<text x="790" y="206" class="label">Linea semilunaris</text><text x="1196" y="206" class="label">Linea semilunaris</text>
<path d="M842 300 C780 318 772 366 818 410" class="artery"/><path d="M1284 300 C1346 318 1354 366 1308 410" class="artery"/><text x="790" y="450" class="note">Neurovascular bundles enter rectus laterally: preserve during dissection.</text>
<rect x="898" y="470" width="390" height="42" rx="10" class="pearl"/><text x="922" y="497" class="note">Retrorectus space is the workhorse plane.</text>
<rect x="44" y="535" width="650" height="350" rx="18" class="panel"/><text x="68" y="573" class="sub">TAR anatomy</text><text x="68" y="601" class="h">Posterior Component Separation</text>
<rect x="120" y="625" width="130" height="185" rx="40" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/><path d="M252 640 L360 640 L360 808 L252 808 Z" fill="#e5e7eb" stroke="#475569" stroke-width="3"/><path d="M360 650 C430 665 480 710 515 780" fill="none" stroke="#b85d66" stroke-width="34" stroke-linecap="round"/>
<path d="M360 660 C405 682 438 716 462 760" class="cut"/><text x="388" y="650" class="label">TAR release</text><text x="384" y="740" class="label">Transversus abdominis</text><text x="126" y="842" class="note">Open posterior sheath medial to neurovascular bundles, then release transversus.</text>
<rect x="746" y="535" width="650" height="350" rx="18" class="panel"/><text x="770" y="573" class="sub">Failure points</text><text x="770" y="601" class="h">Enterotomy and Bridge Pitfalls</text>
<circle cx="875" cy="655" r="28" class="danger"/><text x="920" y="662" class="label">Adhesions to anterior wall</text>
<circle cx="875" cy="720" r="28" class="danger"/><text x="920" y="727" class="label">Bowel in hernia sac</text>
<circle cx="875" cy="785" r="28" class="danger"/><text x="920" y="792" class="label">Old mesh / midline scar</text>
<rect x="790" y="820" width="560" height="50" rx="10" class="danger"/><text x="812" y="850" class="note">Enterotomy changes the mesh decision. Bridged inlay repair is a recurrence trap.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
</svg>