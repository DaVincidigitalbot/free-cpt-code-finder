<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img">
<defs>
<linearGradient id="bowel" x1="0" x2="1"><stop offset="0" stop-color="#f3c7a9"/><stop offset="1" stop-color="#c9836f"/></linearGradient>
<linearGradient id="organ" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7d7bd"/><stop offset="1" stop-color="#b86761"/></linearGradient>
<linearGradient id="muscle" x1="0" x2="1"><stop offset="0" stop-color="#e7a0a0"/><stop offset="1" stop-color="#a94d55"/></linearGradient>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#111827"/></marker>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#23577b"/></marker>
<style>
.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d7dee8;stroke-width:2}.title{font:700 30px Inter,Arial,sans-serif;fill:#102033}.sub{font:700 14px Inter,Arial,sans-serif;fill:#526173;text-transform:uppercase;letter-spacing:1.2px}.h{font:700 20px Inter,Arial,sans-serif;fill:#102033}.label{font:600 15px Inter,Arial,sans-serif;fill:#132033}.small{font:600 13px Inter,Arial,sans-serif;fill:#263447}.note{font:500 14px Inter,Arial,sans-serif;fill:#344256}.tiny{font:500 12px Inter,Arial,sans-serif;fill:#4b5563}.leader{fill:none;stroke:#1f2937;stroke-width:1.5;marker-end:url(#dot)}.artery{fill:none;stroke:#b91c1c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.vein{fill:none;stroke:#2563eb;stroke-width:5;stroke-linecap:round}.nerve{fill:none;stroke:#d6a21e;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:7 5}.danger{fill:#fff1f2;stroke:#dc2626;stroke-width:2}.pearl{fill:#ecfdf5;stroke:#6aa06c;stroke-width:2}.variant{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.flow{fill:#eef6ff;stroke:#23577b;stroke-width:2}.mesh{fill:#dbeafe;stroke:#2563eb;stroke-width:2;stroke-dasharray:6 4}.zone1{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.zone2{fill:#ffedd5;stroke:#ea580c;stroke-width:2}.zone3{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.fat{fill:#f6d7a8;stroke:#b7791f;stroke-width:2}.sheath{fill:#e5e7eb;stroke:#475569;stroke-width:2}.pleura{fill:#dff4ff;stroke:#0284c7;stroke-width:2}.skin{fill:#f5c6aa;stroke:#8b4b3f;stroke-width:2}
</style>
</defs>
<rect width="1440" height="980" class="bg"/>
<text x="54" y="52" class="title">Ventral Hernia Repair: Flagship Abdominal Wall Atlas</text>
<text x="54" y="80" class="note">True cross-sectional wall anatomy, retrorectus space, posterior sheath, linea semilunaris, TAR, mesh planes, and enterotomy risk.</text>
<rect x="44" y="112" width="650" height="390" rx="18" class="panel"/><text x="68" y="150" class="sub">True cross-section</text><text x="68" y="178" class="h">Abdominal Wall Layers</text>
<rect x="125" y="205" width="420" height="26" rx="8" class="skin"/><text x="565" y="224" class="label">Skin</text>
<rect x="125" y="240" width="420" height="34" rx="8" class="fat"/><text x="565" y="263" class="label">Subcutaneous tissue</text>
<rect x="125" y="285" width="420" height="26" rx="8" fill="#d98282" stroke="#334155"/><text x="565" y="305" class="label">External oblique</text>
<rect x="125" y="320" width="420" height="26" rx="8" fill="#c96f76" stroke="#334155"/><text x="565" y="340" class="label">Internal oblique</text>
<rect x="125" y="355" width="420" height="26" rx="8" fill="#b85d66" stroke="#334155"/><text x="565" y="375" class="label">Transversus abdominis</text>
<rect x="245" y="398" width="120" height="90" rx="35" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/><text x="92" y="452" class="label">Rectus muscle</text>
<rect x="382" y="405" width="180" height="24" rx="8" class="sheath"/><text x="565" y="425" class="label">Posterior sheath</text>
<rect x="405" y="445" width="155" height="22" rx="8" class="fat"/><text x="565" y="462" class="label">Preperitoneal fat</text>
<rect x="425" y="478" width="135" height="20" rx="8" fill="#fff" stroke="#475569"/><text x="565" y="496" class="label">Peritoneum</text>
<path d="M365 420 C420 420 455 438 488 468" class="artery"/><text x="92" y="520" class="note">Neurovascular bundles enter rectus laterally; do not skeletonize them.</text>
<rect x="746" y="112" width="650" height="390" rx="18" class="panel"/><text x="770" y="150" class="sub">Mesh plane comparison</text><text x="770" y="178" class="h">Same Defect, Different Planes</text>
<rect x="835" y="222" width="365" height="238" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="892" y="252" width="250" height="24" rx="8" class="skin"/><rect x="892" y="290" width="250" height="24" rx="8" fill="#d98282" stroke="#334155"/><rect x="892" y="328" width="250" height="38" rx="14" fill="url(#muscle)" stroke="#7f1d1d"/><rect x="892" y="382" width="250" height="22" rx="8" class="sheath"/><rect x="892" y="430" width="250" height="20" rx="8" fill="#fff" stroke="#475569"/>
<rect x="790" y="246" width="88" height="34" rx="9" class="mesh"/><text x="808" y="268" class="small">Onlay</text>
<rect x="1162" y="332" width="128" height="34" rx="9" class="mesh"/><text x="1178" y="354" class="small">Retrorectus</text>
<rect x="1162" y="395" width="138" height="34" rx="9" class="mesh"/><text x="1176" y="417" class="small">Preperitoneal</text>
<rect x="790" y="430" width="146" height="34" rx="9" class="mesh"/><text x="804" y="452" class="small">Intraperitoneal</text>
<text x="945" y="490" class="note">Mesh plane determines adhesions, infection strategy, recurrence risk.</text>
<rect x="44" y="535" width="650" height="330" rx="18" class="panel"/><text x="68" y="573" class="sub">Retrorectus and TAR</text><text x="68" y="601" class="h">TAR and Posterior Sheath</text>
<rect x="150" y="630" width="110" height="175" rx="40" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/><rect x="430" y="630" width="110" height="175" rx="40" fill="url(#muscle)" stroke="#7f1d1d" stroke-width="3"/><path d="M262 650 L428 650 L428 802 L262 802 Z" class="sheath"/>
<path d="M145 612 L145 825" stroke="#9333ea" stroke-width="5" stroke-dasharray="10 8"/><path d="M548 612 L548 825" stroke="#9333ea" stroke-width="5" stroke-dasharray="10 8"/><text x="92" y="625" class="small">Linea semilunaris</text><text x="472" y="625" class="small">Linea semilunaris</text>
<path d="M428 665 C480 690 515 732 535 792" stroke="#dc2626" stroke-width="5" stroke-dasharray="9 7"/><text x="450" y="720" class="label">TAR release</text>
<path d="M150 700 C100 715 92 755 130 790" class="artery"/><path d="M540 700 C590 715 598 755 560 790" class="artery"/><text x="180" y="840" class="note">TAR extends the retromuscular plane while preserving neurovascular bundles.</text>
<rect x="746" y="535" width="650" height="330" rx="18" class="panel"/><text x="770" y="573" class="sub">Enterotomy and reconstruction risk</text><text x="770" y="601" class="h">What Changes the Operation</text>
<circle cx="845" cy="640" r="25" class="danger"/><text x="890" y="647" class="label">Adhesions to anterior abdominal wall</text>
<circle cx="845" cy="704" r="25" class="danger"/><text x="890" y="711" class="label">Bowel in hernia sac</text>
<circle cx="845" cy="768" r="25" class="danger"/><text x="890" y="775" class="label">Old mesh or midline scar</text>
<rect x="790" y="804" width="560" height="48" rx="10" class="danger"/><text x="812" y="834" class="note">Enterotomy recognition is critical. Bridged inlay repair is a recurrence trap.</text>
<text x="54" y="952" class="tiny">Educational surgical anatomy illustration. Anatomy varies; operative decisions depend on exposure, patient factors, and attending surgeon judgment.</text>
</svg>