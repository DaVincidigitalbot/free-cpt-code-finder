    <path d="M626 310 C582 412 568 670 618 862" class="release"/>
    <path d="M974 310 C1018 412 1032 670 982 862" class="release"/>
    <path d="M462 432 C552 404 636 396 710 410 L696 906 C586 914 486 886 402 826 C380 670 390 534 462 432Z" class="plane"/>
    <path d="M1138 432 C1048 404 964 396 890 410 L904 906 C1014 914 1114 886 1198 826 C1220 670 1210 534 1138 432Z" class="plane"/>

    <path d="M418 410 C526 372 654 356 800 356 C946 356 1074 372 1182 410 L1158 914 C1042 956 920 976 800 976 C680 976 558 956 442 914 Z" class="meshBase"/>
    <path d="M418 410 C526 372 654 356 800 356 C946 356 1074 372 1182 410 L1158 914 C1042 956 920 976 800 976 C680 976 558 956 442 914 Z" fill="url(#meshGrid)" opacity=".9"/>
    <path d="M684 398 C742 376 858 376 916 398 L900 898 C846 922 754 922 700 898 Z" class="posterior" opacity=".88"/>
    <path d="M704 430 C746 412 854 412 896 430 L882 858 C834 876 766 876 718 858 Z" class="peritoneum" opacity=".9"/>

    <path d="M608 286 C552 396 534 676 596 886" fill="none" stroke="#7b8794" stroke-width="5" stroke-linecap="round"/>
    <path d="M992 286 C1048 396 1066 676 1004 886" fill="none" stroke="#7b8794" stroke-width="5" stroke-linecap="round"/>
    <path d="M552 372 C508 420 484 518 480 664" class="nerve"/>
    <path d="M1048 372 C1092 420 1116 518 1120 664" class="nerve"/>
    <path d="M538 374 C498 424 474 520 470 662" class="vessel"/>
    <path d="M1062 374 C1102 424 1126 520 1130 662" class="vessel"/>
  </g>

  <g>
    <rect x="556" y="170" width="488" height="94" rx="14" class="pearls"/>
    <circle cx="590" cy="204" r="14" class="num"/><text x="590" y="204" class="numText">7</text>
    <text x="618" y="212" class="ink micro">TAR release medial to linea semilunaris</text>
    <circle cx="590" cy="238" r="14" class="num"/><text x="590" y="238" class="numText">8</text>
    <text x="618" y="246" class="ink micro">Expanded retromuscular / preperitoneal space</text>
  </g>

  <g>
    <circle cx="444" cy="282" r="14" class="num"/><text x="444" y="282" class="numText">1</text>
    <circle cx="690" cy="326" r="14" class="num"/><text x="690" y="326" class="numText">2</text>
    <circle cx="420" cy="404" r="14" class="num"/><text x="420" y="404" class="numText">3</text>
    <circle cx="728" cy="844" r="14" class="num"/><text x="728" y="844" class="numText">4</text>
    <circle cx="552" cy="392" r="14" class="num"/><text x="552" y="392" class="numText">5</text>
    <circle cx="608" cy="286" r="14" class="num"/><text x="608" y="286" class="numText">6</text>
    <circle cx="626" cy="350" r="14" class="num"/><text x="626" y="350" class="numText">7</text>
    <circle cx="506" cy="560" r="14" class="num"/><text x="506" y="560" class="numText">8</text>
    <circle cx="846" cy="680" r="14" class="num"/><text x="846" y="680" class="numText">9</text>
    <text x="70" y="242" class="ink label">Rectus muscles</text><path d="M284 234 C356 226 414 232 480 268" class="leader"/>
    <text x="70" y="312" class="ink label">Posterior rectus sheath</text><path d="M374 304 C474 292 576 294 676 326" class="leader"/>
    <text x="70" y="382" class="ink label">Transversus abdominis</text><path d="M386 374 C456 370 536 380 620 418" class="leader"/>
    <text x="70" y="452" class="ink label">TAR release incision</text><path d="M360 444 C452 448 546 416 624 340" class="leaderRed"/>
    <text x="70" y="522" class="ink label">Neurovascular bundles</text><path d="M382 514 C456 520 506 488 552 394" class="leaderRed"/>
    <text x="70" y="592" class="ink label">Linea semilunaris</text><path d="M344 584 C452 588 548 514 608 286" class="leader"/>

    <text x="1168" y="242" class="ink label">Linea alba</text><path d="M1160 234 C1038 238 918 258 804 362" class="leader"/>
    <text x="1168" y="324" class="ink label">Retromuscular /</text><text x="1168" y="356" class="ink label">preperitoneal plane</text><path d="M1160 344 C1062 420 994 468 902 520" class="leader"/>
    <text x="1168" y="446" class="ink label">Mesh</text><path d="M1160 438 C1048 520 956 612 846 680" class="leader"/>
    <text x="1168" y="526" class="ink label">Peritoneum</text><path d="M1160 518 C1052 622 958 732 880 844" class="leader"/>
    <text x="1168" y="606" class="ink label">Posterior layer closure</text><path d="M1160 598 C1040 708 946 806 886 890" class="leader"/>
  </g>

  <g>
    <rect x="78" y="1036" width="318" height="72" rx="14" class="callout"/>
    <text x="104" y="1066" class="micro ink">Release is medial to</text>
    <text x="104" y="1091" class="micro ink">the linea semilunaris.</text>
    <rect x="424" y="1036" width="314" height="72" rx="14" class="warn"/>
    <text x="450" y="1066" class="micro ink">Protect neurovascular</text>
    <text x="450" y="1091" class="micro ink">bundles.</text>
    <rect x="766" y="1036" width="352" height="72" rx="14" class="callout"/>
    <text x="792" y="1066" class="micro ink">TAR expands the retromuscular</text>
    <text x="792" y="1091" class="micro ink">space laterally.</text>
    <rect x="1146" y="1036" width="364" height="72" rx="14" class="warn"/>
    <text x="1172" y="1066" class="micro ink">Mesh remains extraperitoneal;</text>
    <text x="1172" y="1091" class="micro ink">posterior closure protects bowel.</text>
  </g>

  <g>
    <rect x="270" y="1128" width="1060" height="52" rx="16" class="goal"/>
    <text x="306" y="1164" class="ink note">Goal: Wide, well-vascularized extraperitoneal mesh reinforcement with midline fascial closure.</text>
  </g>
</svg>
