<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc">
  <title id="title">Posterior view of transversus abdominis release extending retrorectus repair</title>
  <desc id="desc">Surgical atlas plate showing posterior rectus sheath, rectus muscles, transversus abdominis, linea alba, linea semilunaris, neurovascular bundles, TAR release incision, retromuscular preperitoneal plane, mesh, peritoneum, and the goal of wide extraperitoneal reinforcement.</desc>
  <defs>
    <linearGradient id="muscle" x1="0" x2="1"><stop offset="0" stop-color="#9f302c"/><stop offset="0.5" stop-color="#de7166"/><stop offset="1" stop-color="#9f302c"/></linearGradient>
    <linearGradient id="mesh" x1="0" x2="1"><stop offset="0" stop-color="#d9ecff"/><stop offset="0.5" stop-color="#eef7ff"/><stop offset="1" stop-color="#d9ecff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#16202a" flood-opacity=".18"/></filter>
    <pattern id="meshGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M0 0H30M0 0V30" fill="none" stroke="#6aa6d9" stroke-width="2" opacity=".55"/><path d="M0 30L30 0" fill="none" stroke="#6aa6d9" stroke-width="1.5" opacity=".38"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#24313f"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9f1d1d"/></marker>
    <style>
      .bg{fill:#f7f4ee}.panel{fill:#fffdf8;stroke:#d4c8b8;stroke-width:2}.header{fill:#10263d}.ink{fill:#1f2933}.white{fill:#fff}.muted{fill:#536170}.h1{font:800 42px Inter,Arial,sans-serif}.h2{font:800 30px Inter,Arial,sans-serif}.label{font:700 27px Inter,Arial,sans-serif}.small{font:500 24px Inter,Arial,sans-serif}.note{font:650 24px Inter,Arial,sans-serif}.micro{font:650 20px Inter,Arial,sans-serif}.leader{fill:none;stroke:#24313f;stroke-width:3;marker-end:url(#arrow)}.leaderRed{fill:none;stroke:#9f1d1d;stroke-width:3;marker-end:url(#redArrow)}.fascia{fill:#f5eee2;stroke:#b79f87;stroke-width:4}.posterior{fill:#efe2d1;stroke:#a88d72;stroke-width:4}.plane{fill:#a8d7ff;opacity:.45;stroke:#1976a2;stroke-width:4}.meshBase{fill:url(#mesh);stroke:#2874a6;stroke-width:4}.release{fill:none;stroke:#bb1f1f;stroke-width:9;stroke-linecap:round;stroke-dasharray:18 14}.nerve{fill:none;stroke:#f3c623;stroke-width:8;stroke-linecap:round}.vessel{fill:none;stroke:#c52222;stroke-width:5;stroke-linecap:round}.peritoneum{fill:#f6d8c7;stroke:#9b5d47;stroke-width:4}.callout{fill:#edf7ff;stroke:#88b9d8;stroke-width:2}.warn{fill:#fff4dc;stroke:#d5a33c;stroke-width:2}.goal{fill:#f0f7ee;stroke:#8ab17d;stroke-width:3}.pearls{fill:#ffffff;stroke:#cfd8df;stroke-width:2}.num{fill:#10263d}.numText{fill:#fff;font:800 18px Inter,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1220"/>
  <rect x="28" y="28" width="1544" height="1164" rx="22" class="panel"/>
  <rect x="48" y="48" width="1504" height="100" rx="14" class="header"/>
  <text x="76" y="90" class="white h1">B. POSTERIOR VIEW - TAR EXTENDS RETRORECTUS REPAIR</text>
  <text x="76" y="126" class="white small">Posterior component separation expands the retromuscular space laterally while keeping mesh extraperitoneal.</text>

  <g filter="url(#shadow)">
    <path d="M480 210 C430 312 406 446 408 606 C410 762 446 894 512 996 C596 954 650 842 664 690 L686 424 C654 318 586 246 480 210Z" fill="url(#muscle)" stroke="#7f2d2a" stroke-width="5"/>
    <path d="M1120 210 C1170 312 1194 446 1192 606 C1190 762 1154 894 1088 996 C1004 954 950 842 936 690 L914 424 C946 318 1014 246 1120 210Z" fill="url(#muscle)" stroke="#7f2d2a" stroke-width="5"/>
    <path d="M672 224 C726 196 874 196 928 224 L914 998 C854 1034 746 1034 686 998 Z" class="posterior"/>
    <path d="M800 206 L800 1030" fill="none" stroke="#fdfaf5" stroke-width="14" stroke-linecap="round"/>
    <path d="M800 206 L800 1030" fill="none" stroke="#7b8794" stroke-width="4" stroke-linecap="round"/>

    <path d="M646 290 C710 260 890 260 954 290 L930 944 C860 982 740 982 670 944 Z" class="plane"/>
    <path d="M354 376 C452 316 560 294 660 300 C630 450 622 666 654 848 C552 856 454 826 372 754 C322 600 316 476 354 376Z" fill="#8e5bb8" stroke="#5a347d" stroke-width="4"/>
