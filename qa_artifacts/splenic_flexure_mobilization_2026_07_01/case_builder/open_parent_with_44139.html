<!doctype html><html><head><meta charset="utf-8"><title>open_parent_with_44139</title><style>body{margin:0}iframe{width:1440px;height:1200px;border:0}</style></head><body><iframe id="site" src="/"></iframe><script>
const iframe=document.getElementById('site');
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
iframe.onload=async()=>{
 const w=iframe.contentWindow;
 for(let i=0;i<120;i++){if(w.loadCptSearchIndex&&w.addCptDirectly)break;await wait(100);}
 await w.loadCptSearchIndex();
 for(const code of ["44140","44139"]){w.addCptDirectly(code);await wait(500);}
 await wait(1000);
 document.body.dataset.done='1';
};
</script></body></html>
